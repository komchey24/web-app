name: deploy-s3

on:
  push:
    branches: [dev]
  # Allow manual deploys from the Actions tab
  workflow_dispatch:

# Cancel an in-flight deploy if a newer commit lands
concurrency:
  group: deploy-s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to S3
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync assets to S3
        # Build uses --output-hashing=none, so js/css names never change
        # between releases — keep the cache short to avoid serving stale code.
        run: |
          aws s3 sync dist/web-app/browser "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=3600"

      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/web-app/browser/index.html "s3://${{ secrets.AWS_S3_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Purge Bunny CDN cache
        if: ${{ secrets.BUNNY_PULL_ZONE_ID != '' }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.bunny.net/pullzone/${{ secrets.BUNNY_PULL_ZONE_ID }}/purgeCache" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
            -H "Content-Type: application/json")
          if [ "$HTTP_STATUS" -ne 204 ]; then
            echo "Bunny CDN purge failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Bunny CDN cache purged"