name: deploy-bunny

on:
  push:
    branches: [dev]
  # Allow manual deploys from the Actions tab
  workflow_dispatch:

# Cancel an in-flight deploy if a newer commit lands
concurrency:
  group: deploy-bunny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Bunny
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

      - name: Upload to Bunny Storage
        env:
          BUNNY_STORAGE_URL: https://sg.storage.bunnycdn.com/kc24
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        working-directory: dist/web-app/browser
        # Storage API has no sync, so PUT every file; index.html goes last so
        # it never references assets that haven't landed yet.
        run: |
          set -euo pipefail
          upload() {
            curl -sS --fail-with-body -X PUT "${BUNNY_STORAGE_URL}/${1#./}" \
              -H "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$1" > /dev/null
          }
          export -f upload
          export BUNNY_STORAGE_URL BUNNY_STORAGE_PASSWORD
          find . -type f ! -path ./index.html -print0 | xargs -0 -P 8 -I {} bash -c 'upload "$1"' _ {}
          upload ./index.html
          echo "Uploaded to Bunny Storage"

      - name: Purge Bunny CDN cache
        env:
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          if [ -z "$BUNNY_PULL_ZONE_ID" ]; then
            echo "BUNNY_PULL_ZONE_ID not set — skipping CDN purge"
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            -H "Content-Type: application/json")
          if [ "$HTTP_STATUS" -ne 204 ]; then
            echo "Bunny CDN purge failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Bunny CDN cache purged"

      # Bundles (main-*.js, chunk-*.js, styles-*.css, media/*) are content-hashed and
      # keep the pull zone's long browser cache. Files with fixed names must be
      # revalidated by browsers on every load, otherwise they keep a stale index.html
      # (pointing at old bundles) or stale translations/env.js for months.
      - name: Configure Bunny browser cache rules
        env:
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BUNNY_PULL_ZONE_ID" ]; then
            echo "BUNNY_PULL_ZONE_ID not set — skipping cache rules"
            exit 0
          fi
          API="https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}"
          DESCRIPTION="web-app: revalidate non-hashed files (managed by deploy-bunny.yml)"
          # Reuse the existing rule's Guid so re-running updates it instead of adding duplicates
          GUID=$(curl -sS --fail-with-body "$API" -H "AccessKey: ${BUNNY_API_KEY}" \
            | jq -r --arg d "$DESCRIPTION" '[.EdgeRules[]? | select(.Description == $d) | .Guid][0] // empty')
          BODY=$(jq -n --arg guid "$GUID" --arg d "$DESCRIPTION" '{
            ActionType: 16,
            ActionParameter1: "0",
            Triggers: [{
              Type: 0,
              PatternMatchingType: 0,
              PatternMatches: ["*/", "*/index.html", "*/manifest.json", "*/mifosx-theme.css", "*/robots.txt", "*/favicon.ico", "*/assets/*"]
            }],
            TriggerMatchingType: 0,
            Description: $d,
            Enabled: true
          } + (if $guid == "" then {} else {Guid: $guid} end)')
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST "$API/edgerules/addOrUpdate" \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          STATUS=$(echo "$RESPONSE" | tail -n1)
          if [ "${STATUS:0:1}" != "2" ]; then
            echo "Bunny edge rule update failed with HTTP $STATUS:"
            echo "$RESPONSE" | sed '$d'
            echo "Request body:"
            echo "$BODY"
            exit 1
          fi
          echo "Browser cache rule ${GUID:-created} applied (Override Browser Cache Time = 0 for non-hashed files)"
